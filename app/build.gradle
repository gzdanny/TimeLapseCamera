plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.timelapse.camera'
    compileSdk 34

    defaultConfig {
        applicationId "com.timelapse.camera"
        minSdk 26          // Android 8.0: CameraX 稳定，getExternalFilesDir无需权限
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // 协程: 异步拍摄流程
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    // 协程 + Future 互操作（给 ListenableFuture 扩展 await() 挂起函数）
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.7.3'

    // Fragment: 底部导航的 4 个页面
    implementation 'androidx.fragment:fragment-ktx:1.6.2'

    // CameraX: 统一预览 + 拍照（替代手写 Camera2）
    def camerax_version = "1.3.1"
    implementation "androidx.camera:camera-core:$camerax_version"
    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"
    implementation "androidx.camera:camera-view:$camerax_version"

    // Coil: 相册缩略图加载（Kotlin-first，比 Glide 更简洁）
    implementation 'io.coil-kt:coil:2.5.0'
}
